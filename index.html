#viewer{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center}
#viewer img{max-width:95%;max-height:90%}
#close{position:absolute;top:15px;right:20px;font-size:30px;color:#fff;cursor:pointer}
.hidden{display:none}
footer{background:#fff;padding:10px;text-align:center;font-size:14px}
