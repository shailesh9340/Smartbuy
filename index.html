<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartBuy.ind</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f1f3f6}
header{background:#2874f0;color:#fff;padding:14px;text-align:center;font-size:24px;font-weight:bold}
.topbar{display:flex;justify-content:space-around;background:#fff;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.topbar button{border:none;background:#2874f0;color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer}

.container{padding:10px}
.card{background:#fff;margin-bottom:15px;padding:12px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}

.slider{display:flex;gap:8px;overflow-x:auto}
.slider img{height:170px;border-radius:6px;cursor:pointer}

.price{color:#2ecc71;font-size:18px;font-weight:bold}
.cut{text-decoration:line-through;color:#888;margin-left:6px}
.off{color:#e74c3c;margin-left:6px}

.buy,.wish{display:block;margin-top:8px;text-align:center;padding:10px;border-radius:6px;text-decoration:none;font-weight:bold;cursor:pointer}
.buy{background:#ff9f00;color:#000}
.wish{background:#fff;border:1px solid #2874f0;color:#2874f0}

.category{display:flex;gap:12px;overflow-x:auto}
.category div{text-align:center;font-size:13px}
.category img{width:80px;height:80px;border-radius:50%;object-fit:cover}

footer{background:#fff;padding:12px;text-align:center;font-size:14px}

.hidden{display:none}

/* IMAGE VIEWER */
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:10}
#viewer img{max-width:95%;max-height:90%}
#close{position:absolute;top:15px;right:20px;font-size:32px;color:#fff;cursor:pointer}

/* ACCOUNT */
input{width:100%;padding:10px;margin-top:8px}
</style>
</head>

<body>

<header>SmartBuy.ind</header>

<div class="topbar">
<button onclick="openWishlist()">🤍 Wishlist</button>
<button onclick="openAccount()">👤 Account</button>
<button onclick="toggleDonate()">❤️ Donate SmartBuy Foundation</button>
</div>

<div class="container">

<!-- CATEGORIES -->
<div class="card">
<h3>Categories</h3>
<div class="category">
<div><img src="https://images.unsplash.com/photo-1520975916090-3105956dac38"><br>Women</div>
<div><img src="https://images.unsplash.com/photo-1528701800489-20be3c5fa0a4"><br>Men</div>
<div><img src="https://images.unsplash.com/photo-1542060748-10c28b62716c"><br>Bags</div>
<div><img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f"><br>Fashion</div>
</div>
</div>

<!-- PRODUCTS -->
<div id="products"></div>

<!-- DONATION -->
<div id="donate" class="card hidden">
<h3>Donate SmartBuy Foundation ❤️</h3>
<p><b>UPI:</b> 9343988416-2@ybl</p>
</div>

<!-- WISHLIST -->
<div id="wishlist" class="card hidden">
<h3>Your Wishlist</h3>
<div id="wishlistItems"></div>
</div>

<!-- ACCOUNT -->
<div id="account" class="card hidden">
<h3>Account</h3>
<input id="username" placeholder="Enter your name">
<button class="buy" onclick="saveUser()">Save</button>
<p id="userMsg"></p>
</div>

</div>

<footer>
📧 Customer Support: <b>shailedhkumarchauhan9340@gmail.com</b><br><br>
<a href="https://www.instagram.com/smartbuy.ind_?igsh=MWUwNTNzczI4YjZsdw==" target="_blank">
Follow @smartbuy.ind_
</a>
</footer>

<!-- IMAGE VIEW -->
<div id="viewer">
<span id="close" onclick="closeView()">×</span>
<img id="big">
</div>

<script>
// PRODUCTS DATA (NO NEED TO EDIT)
const products=[
{
name:"Premium Bagpack Encrypted (Password)",
price:322,cut:999,off:"68% OFF",
link:"https://bitli.in/JZizUxb",
images:[
"https://i.ibb.co/Xf2HkkcP/Screenshot-2026-01-28-09-16-20-919-com-flipkart-shopsy-edit.jpg",
"https://i.ibb.co/yttFXZ4/Screenshot-2026-01-28-09-17-19-979-com-flipkart-shopsy-edit.jpg",
"https://i.ibb.co/TDnkXXt6/Screenshot-2026-01-28-09-17-07-342-com-flipkart-shopsy.jpg",
"https://i.ibb.co/XZ2kWLwy/Screenshot-2026-01-28-09-16-37-380-com-flipkart-shopsy-edit.jpg"
]
},
{
name:"Women Floral Kurti",
price:253,cut:1999,off:"87% OFF",
link:"https://bitli.in/mYd26le",
images:[
"https://i.ibb.co/jvnM1DvY/Screenshot-2026-01-28-20-42-57-901-com-flipkart-shopsy-edit.jpg",
"https://i.ibb.co/dw8Z04GJ/Screenshot-2026-01-28-20-43-10-575-com-flipkart-shopsy-edit.jpg",
"https://i.ibb.co/svt2y75W/Screenshot-2026-01-28-20-43-22-071-com-flipkart-shopsy-edit.jpg"
]
},
{
name:"Men Regular Fit Trousers",
price:262,cut:999,off:"73% OFF",
link:"https://bitli.in/w8hSXkv",
images:[
"https://i.ibb.co/xKgxySx2/Screenshot-2026-01-28-20-51-16-478-com-flipkart-shopsy-edit.jpg",
"https://i.ibb.co/zWcpyJSk/Screenshot-2026-01-28-20-51-44-808-com-flipkart-shopsy-edit.jpg",
"https://i.ibb.co/FqWStjST/Screenshot-2026-01-28-20-51-31-368-com-flipkart-shopsy-edit.jpg"
]
}
];

// RENDER PRODUCTS
const pDiv=document.getElementById("products");
products.forEach((p,i)=>{
pDiv.innerHTML+=`
<div class="card">
<h3>${p.name}</h3>
<div class="slider">
${p.images.map(img=>`<img src="${img}" onclick="view('${img}')">`).join("")}
</div>
<div>
<span class="price">₹${p.price}</span>
<span class="cut">₹${p.cut}</span>
<span class="off">${p.off}</span>
</div>
<a class="buy" href="${p.link}" target="_blank">Buy Now</a>
<div class="wish" onclick="addWishlist(${i})">🤍 Add to Wishlist</div>
</div>`;
});

// IMAGE VIEW
function view(src){
document.getElementById("viewer").style.display="flex";
document.getElementById("big").src=src;
}
function closeView(){document.getElementById("viewer").style.display="none";}

// WISHLIST REAL STORAGE
let wishlist=JSON.parse(localStorage.getItem("wishlist"))||[];
function addWishlist(i){
wishlist.push(products[i]);
localStorage.setItem("wishlist",JSON.stringify(wishlist));
alert("Added to Wishlist ❤️");
}
function openWishlist(){
document.getElementById("wishlist").classList.toggle("hidden");
const w=document.getElementById("wishlistItems");
w.innerHTML=wishlist.map(p=>`<p>• ${p.name}</p>`).join("");
}

// ACCOUNT REAL STORAGE
function openAccount(){document.getElementById("account").classList.toggle("hidden");}
function saveUser(){
const name=document.getElementById("username").value;
localStorage.setItem("user",name);
document.getElementById("userMsg").innerText="Saved as "+name;
}

// DONATION
function toggleDonate(){
document.getElementById("donate").classList.toggle("hidden");
}
</script>

</body>
</html>
